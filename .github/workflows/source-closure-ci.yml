name: HKIA public source closure CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native-product/**'
      - 'scripts/**'
      - 'tests/**'
      - 'contracts/**'
      - 'data/**'
      - 'assets/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/source-closure-ci.yml'
permissions:
  contents: read
concurrency:
  group: hkia-source-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm test
      - run: npm run build
      - run: npm run check

name: HKIA Svelte R1 followup fixed lock compile and browser
on:
  push:
    branches:
      - web05/svelte-navigation-r1
permissions:
  contents: read
concurrency:
  group: hkia-svelte-r1-isolated
  cancel-in-progress: false
jobs:
  isolated:
    if: github.repository == '0xmorarin/HKIA-Editor' && github.ref == 'refs/heads/web05/svelte-navigation-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify fixed R1 code and provision dependencies
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bb563adb29046fb83f0360a303b9119487bb43dd HEAD
          test "$(git diff --name-only bb563adb29046fb83f0360a303b9119487bb43dd HEAD)" = .github/workflows/svelte05-r1-isolated.yml
          cd svelte-ui
          printf '%s  package-lock.json\n' 8f8e45f756f9a1cc03e7f9e0f89b0962ce5d9200c321e5de20532a02e01c92bd | sha256sum -c -
          npm ci --no-audit --no-fund
          sha256sum package-lock.json
          node --version
          npm --version
      - name: Compile and test isolated UI
        working-directory: svelte-ui
        run: |
          set -euo pipefail
          npm test
          npm run check -- --fail-on-warnings
          node --experimental-strip-types scripts/verify-legacy-port.mjs ..
          npm run build
      - name: Actual built Vite Chromium navigation
        working-directory: svelte-ui
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/browser-parity.py dist
      - name: Retain dependency lock for Web05
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hkia-svelte-r1-package-lock
          path: svelte-ui/package-lock.json
          if-no-files-found: warn
          retention-days: 7

name: HKIA Svelte isolated locale consumer R1
on:
  push:
    branches:
      - web05/svelte-locale-consumer-r1
permissions:
  contents: read
concurrency:
  group: hkia-svelte-locale-r1-isolated
  cancel-in-progress: false
jobs:
  isolated:
    if: github.repository == '0xmorarin/HKIA-Editor' && github.ref == 'refs/heads/web05/svelte-locale-consumer-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify fixed locale scope and lock
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9863dd6b38ebcbf4ce25611812dd78ea8dd7e887 HEAD
          test "$(git diff --name-only 9863dd6b38ebcbf4ce25611812dd78ea8dd7e887 HEAD)" = .github/workflows/svelte05-locale-r1-isolated.yml
          cd svelte-ui
          printf '%s  package-lock.json\n' 8f8e45f756f9a1cc03e7f9e0f89b0962ce5d9200c321e5de20532a02e01c92bd | sha256sum -c -
          npm ci --no-audit --no-fund
      - name: Unit compile and isolated synthetic locale build
        working-directory: svelte-ui
        run: |
          set -euo pipefail
          npm test
          npm run check -- --fail-on-warnings
          node --experimental-strip-types scripts/verify-legacy-port.mjs ..
          node --experimental-strip-types scripts/verify-filter-reference.mjs ..
          node --experimental-strip-types scripts/verify-category-reference.mjs ..
          npm run build
          npm exec -- vite build --config vite.locale.config.ts
      - name: Actual Chromium isolated selector and R3 regression
        working-directory: svelte-ui
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/browser-parity.py dist
          python3 scripts/browser-filter-parity.py dist
          python3 scripts/browser-category-parity.py dist
          python3 scripts/browser-locale-parity.py dist-locale

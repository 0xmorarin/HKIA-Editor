name: HKIA Pages isolation probe (no deploy)
on:
  push:
    branches:
      - ctrl/pages-isolation-probe-20261113
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pages: read
jobs:
  verify:
    if: github.event_name == 'push' || github.head_ref == 'ctrl/pages-isolation-probe-20261113'
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,https_enforced,status}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow
          echo "PASS: Pages source is workflow; no deployment was attempted."

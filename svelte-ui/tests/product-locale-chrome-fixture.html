<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Isolated V33 chrome fragments</title><body>
<div class="primary-tabs" role="tablist" aria-label="表示する機能">
        <button id="achTab" role="tab" aria-controls="achPanel" aria-selected="true" class="primary-tab active" type="button">🏅 <span>アチーブメント</span></button>
        <button id="colTab" role="tab" aria-controls="colPanel" aria-selected="false" class="primary-tab" tabindex="-1" type="button">✿ <span>コレクション</span></button>
      </div>
<section id="achPanel" class="content-panel" role="tabpanel" aria-labelledby="achTab">
<div class="toolbar"><label class="search-wrap"><span aria-hidden="true">⌕</span><input id="achievementSearch" type="search" placeholder="日本語名・英語名・GUIDで検索" autocomplete="off" aria-label="実績を検索"></label><select id="achievementFilter" aria-label="達成状況"><option value="all">すべて</option><option value="complete">達成済み</option><option value="incomplete">未達成</option><option value="missing">定義のみ・未保存</option><option value="unknown-source">保存済み・定義UNKNOWN</option></select><select id="achievementImageFilter" aria-label="実績画像で絞り込み" hidden><option value="all">全画像状態</option><option value="exact">直接画像あり</option><option value="source-null">直接画像 SOURCE_NULL</option><option value="unknown">画像未照合</option></select><select id="achievementSort" aria-label="実績の並び順"><option value="source">元の順番</option><option value="name">名称順</option><option value="progress-desc">進捗値の大きい順</option><option value="progress-asc">進捗値の小さい順</option><option value="completed-first">達成済みを先頭</option></select></div>
</section><section id="colPanel" class="content-panel" role="tabpanel" aria-labelledby="colTab" hidden>
<label class="search-wrap collections-search"><span aria-hidden="true">⌕</span><input id="collectionSearch" type="search" placeholder="コレクションカテゴリを検索" autocomplete="off" aria-label="コレクションカテゴリを検索"></label>
<div class="toolbar"><select id="collectionStatusFilter" aria-label="コレクション収集履歴で絞り込み"><option value="all">全カテゴリ</option><option value="has-record">収集履歴あり</option><option value="no-record">収集履歴なし</option><option value="unknown">未照合</option></select><select id="collectionSort" aria-label="コレクションの並び順"><option value="source">定義順</option><option value="name">名称順</option><option value="record-desc">記録ID数の多い順</option></select></div>
</section></body></html>
